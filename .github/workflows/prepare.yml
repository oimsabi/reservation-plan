          image_path = park / 'assets/park-map.png'
          with Image.open(image_path) as image:
              assert image.size == (9000, 6300)
              image.resize((3000, 2100), Image.Resampling.LANCZOS).convert('RGB').save(image_path.with_suffix('.webp'), 'WEBP', quality=85, method=6)
