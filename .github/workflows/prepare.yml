name: Prepare Reservation Plan

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reservation-plan-migration
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image codec
        run: python -m pip install Pillow==11.3.0
      - name: Prepare sanitized static website
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, shutil, zlib
          from pathlib import Path
          from PIL import Image
          source = Path('doi-khun-tan-stay-map-main/dist')
          assert source.is_dir(), 'Expected uploaded park directory is missing; leave repository untouched.'
          assert Path('.github/workflows/pages.yml').is_file(), 'Add the Pages workflow before migration.'
          target = Path(os.environ['RUNNER_TEMP']) / 'reservation-plan-prepared'
          target.mkdir()
          park = target / 'dist/doi-khun-tan'
          shutil.copytree(source, park)
          html_path = park / 'index.html'
          html = html_path.read_text(encoding='utf-8')
          html = html.replace('<head>', '<head>\n  <meta name="robots" content="noindex">', 1)
          html = html.replace('assets/park-map.png', 'assets/park-map.webp').replace('width="9000" height="6300"', 'width="3000" height="2100"')
          html = html.replace('เปิดภาพต้นฉบับ ↗', 'เปิดแผนที่ WebP ↗').replace('ต้นฉบับ 9,000 × 6,300 px', 'WebP · 3,000 × 2,100 px')
          html = html.replace('ใช้ภาพ “doi-khun-tan-reference-9000.png” จากแชต “ขยายแผนที่ 9000 px” ที่ปรับจาก PDF คงสัดส่วน 10:7', 'ใช้แผนที่อ้างอิงที่ผู้ใช้จัดเตรียมจาก PDF แปลงเป็น WebP ขนาด 3,000 × 2,100 พิกเซล คงสัดส่วน 10:7')
          html = html.replace('<header class="header">', '<div class="hub-bar"><a href="../">← Reservation Plan</a><span>บันทึกการเดินทาง / Doi Khun Tan</span></div>\n  <header class="header">', 1)
          html_path.write_text(html, encoding='utf-8')
          with (park / 'style.css').open('a', encoding='utf-8') as css:
              css.write('\n.hub-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px max(4vw,24px);background:#173e33;color:#f8f8f2;font-size:11px}.hub-bar a{font-weight:600;color:inherit}.hub-bar a:hover{text-decoration:underline}.hub-bar span{color:#c0d0bc}@media(max-width:600px){.hub-bar{padding:10px 18px}.hub-bar span{display:none}}\n')
          sources_path = park / 'sources.json'
          sources = json.loads(sources_path.read_text(encoding='utf-8'))
          sources['map'] = 'User-provided reference map derived from PDF; published as assets/park-map.webp at 3000 x 2100 pixels, preserving the 10:7 aspect ratio.'
          sources_path.write_text(json.dumps(sources, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          data_path = park / 'data.js'
          data_path.write_text(data_path.read_text(encoding='utf-8'), encoding='utf-8')
          payload = json.loads(zlib.decompress(base64.b64decode('''
