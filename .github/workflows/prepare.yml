      - name: Validate prepared website
        run: node "$RUNNER_TEMP/reservation-plan-prepared/checks.cjs"
      - name: Commit clean initial website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "oimsabi"
          git config user.email "12725437+oimsabi@users.noreply.github.com"
          git checkout --orphan reservation-clean
          git rm -rf --ignore-unmatch .
          cp -a "$RUNNER_TEMP/reservation-plan-prepared/." .
          git add .
          git diff --cached --check
          git commit -m "Create Reservation Plan with Doi Khun Tan guide"
          git push origin HEAD:main --force-with-lease="refs/heads/main:$GITHUB_SHA"
